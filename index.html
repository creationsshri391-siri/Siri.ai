<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siri AI</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#202124;
}

header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  padding:24px;
  text-align:center;
}

.logo{
  font-size:34px;
  font-weight:bold;
}

.tagline{
  margin-top:8px;
  font-size:15px;
  opacity:.9;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.hero{
  background:white;
  padding:30px 20px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  text-align:center;
}

.hero h2{
  font-size:27px;
  margin-bottom:10px;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:25px;
}

button{
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
  background:#1d4ed8;
}

.section{
  margin-top:20px;
  padding:20px;
  background:white;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.chat-box{
  height:330px;
  overflow-y:auto;
  border:1px solid #ddd;
  border-radius:15px;
  padding:15px;
  margin:15px 0;
  background:#f8fafc;
}

.message{
  margin-bottom:12px;
  padding:12px;
  border-radius:12px;
  line-height:1.5;
}

.user{
  background:#dbeafe;
  text-align:right;
}

.ai{
  background:#e8eaf0;
  text-align:left;
}

.input-area{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

.option{
  display:block;
  width:100%;
  margin:10px 0;
  background:#facc15;
  color:#111;
  text-align:left;
}

#result{
  margin-top:15px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:25px;
  color:#666;
}

@media(max-width:600px){
  .buttons{
    grid-template-columns:1fr;
  }

  .input-area{
    flex-direction:column;
  }

  .logo{
    font-size:28px;
  }
}
</style>
</style>
</head>
<body>
<header><div class="logo">🤖 Siri AI</div><div class="tagline">ಕನ್ನಡದಲ್ಲಿ ಕಲಿಯಿರಿ • ಪ್ರಶ್ನಿಸಿ • ಪರೀಕ್ಷಿಸಿ</div></header>
<div class="container">
<div class="hero">
<h2>Welcome to Siri AI</h2><p>Your Kannada AI Learning Assistant</p>
<div class="buttons">
<button onclick="showChat()">🤖 Siri AI Chat</button>
<button onclick="showQuiz()">📚 Kannada GK Quiz</button>
<button onclick="examInfo()">🎯 Government Exam</button>
<button onclick="youtubeInfo()">🎬 YouTube Content</button>
<button onclick="newChat()">🆕 New Chat</button>
<button onclick="showChatHistory()">📜 Chat History</button>
<button onclick="clearChatHistory()">🗑️ Clear History</button>
</div></div>
<div class="section" id="chatSection">
<h2>🤖 Siri AI Chat</h2>
  <select id="languageSelect">
  <option value="kn">ಕನ್ನಡ</option>
  <option value="en">English</option>
  <option value="hi">हिंदी</option>
</select>
<div class="chat-box" id="chatBox"><div class="message ai">ನಮಸ್ಕಾರ! 👋<br>ನಾನು <b>Siri AI</b>.<br>ನಿಮ್ಮ ಪ್ರಶ್ನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಕೇಳಿ.</div></div>
<div class="input-area">
<input id="userInput" placeholder="ನಿಮ್ಮ ಪ್ರಶ್ನೆಯನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ..." onkeydown="if(event.key==='Enter') sendMessage()">
<button onclick="startVoice()">🎤</button>
<button onclick="searchWeb()">🔍Google</button>
<button onclick="sendMessage()">➤Send</button>
</div></div>
<div class="section" id="quizSection">
<h2>📚 Kannada GK Quiz</h2><br><p><b>ಭಾರತದ ಮೊದಲ ಉಪಗ್ರಹ ಯಾವುದು?</b></p>
<button class="option" onclick="checkAnswer('A')">A. ಭಾಸ್ಕರ</button>
<button class="option" onclick="checkAnswer('B')">B. ಆರ್ಯಭಟ</button>
<button class="option" onclick="checkAnswer('C')">C. ರೋಹಿಣಿ</button>
<button class="option" onclick="checkAnswer('D')">D. INSAT-1A</button>
<div id="result"></div></div></div>
<footer>© 2026 Siri AI</footer>
<script>
async function sendMessage(){
  const input = document.getElementById("userInput");
  const chatBox = document.getElementById("chatBox");
  const message = input.value.trim();
  const language = document.getElementById("languageSelect").value;

  if (!message) return;

  chatBox.innerHTML += `<div class="message user">${message}</div>`;
  input.value = "";

  chatBox.innerHTML += `<div class="message ai">⏳ ಉತ್ತರ ನೀಡಲಾಗುತ್ತಿದೆ...</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;
  saveChatHistory();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
     body: JSON.stringify({
  message: message,
  language: language
    })   
    });

    const data = await response.json();

    const aiMessages = chatBox.querySelectorAll(".message.ai");
    const lastAIMessage = aiMessages[aiMessages.length - 1];

   if (response.ok) {
  lastAIMessage.innerHTML =
    "✅ " + data.answer
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n/g, "<br>");

  if (data.imageUrl) {
    const image = document.createElement("img");
    image.src = data.imageUrl;
    image.alt = "Related image";
    image.style.maxWidth = "100%";
    image.style.borderRadius = "12px";
    image.style.marginTop = "12px";

    lastAIMessage.appendChild(image);
  }
     const voiceButton = document.createElement("button");
voiceButton.textContent = "🔊 ಕೇಳಿ";
voiceButton.style.marginTop = "10px";
voiceButton.style.padding = "8px 14px";
voiceButton.style.borderRadius = "8px";
voiceButton.style.border = "none";
voiceButton.style.cursor = "pointer";

voiceButton.onclick = () => {
  if (speechSynthesis.speaking) {
    speechSynthesis.cancel();
    voiceButton.textContent = "🔊 ಕೇಳಿ";
    return;
  }

  const speech = new SpeechSynthesisUtterance(data.answer);

  speech.lang =
    language === "en" ? "en-IN" : language === "hi" ? "hi-IN" : "kn-IN";

  speech.rate = 0.9;

  voiceButton.textContent = "🔇 ನಿಲ್ಲಿಸಿ";

  speech.onend = () => {
    voiceButton.textContent = "🔊 ಕೇಳಿ";
  };

  speechSynthesis.speak(speech);
};

lastAIMessage.appendChild(voiceButton);
    } else {
      lastAIMessage.textContent =
        "❌ " + (data.error || "ದೋಷ ಸಂಭವಿಸಿದೆ.");
    }

  } catch (error) {
    const aiMessages = chatBox.querySelectorAll(".message.ai");
    const lastAIMessage = aiMessages[aiMessages.length - 1];
    lastAIMessage.textContent = "❌ Server connection error.";
  }

  chatBox.scrollTop = chatBox.scrollHeight;
  saveChatHistory();
}
  function saveChatHistory() {
  const chatBox = document.getElementById("chatBox");
  localStorage.setItem("siriChatHistory", chatBox.innerHTML);
}
  window.addEventListener("load", () => {
  const chatBox = document.getElementById("chatBox");
  const savedChat = localStorage.getItem("siriChatHistory");

  if (savedChat && chatBox) {
    chatBox.innerHTML = savedChat;
  }
});
function showChatHistory() {
  const chats = JSON.parse(
    localStorage.getItem("siriChats") || "[]"
  );

  if (chats.length === 0) {
    alert("📜 ಯಾವುದೇ Chat History ಇಲ್ಲ.");
    return;
  }

  let historyHTML = `
    <div class="message ai">
      <b>📜 Chat History</b><br><br>
  `;

  chats.forEach((chat, index) => {
    historyHTML += `
      <button onclick="loadSavedChat(${index})"
        style="display:block;width:100%;margin:8px 0;padding:10px;border:0;border-radius:8px;cursor:pointer;">
        💬 Chat ${index + 1}
      </button>
    `;
  });

  historyHTML += `</div>`;

  document.getElementById("chatBox").innerHTML = historyHTML;
}

function loadSavedChat(index) {
  const chats = JSON.parse(
    localStorage.getItem("siriChats") || "[]"
  );

  if (chats[index]) {
    document.getElementById("chatBox").innerHTML = chats[index].html;
  }
}

function clearChatHistory() {
  localStorage.removeItem("siriChatHistory");
  document.getElementById("chatBox").innerHTML =
    '<div class="message ai">👋 ನಮಸ್ಕಾರ! ನಾನು Siri AI.</div>';
  alert("🗑️ Chat History cleared.");
}
function checkAnswer(a){const r=document.getElementById("result");if(a==="B"){r.innerHTML="✅ ಸರಿಯಾದ ಉತ್ತರ: ಆರ್ಯಭಟ";r.style.color="green"}else{r.innerHTML="❌ ತಪ್ಪು ಉತ್ತರ. ಸರಿಯಾದ ಉತ್ತರ: ಆರ್ಯಭಟ";r.style.color="red"}}
function showChat(){document.getElementById("chatSection").scrollIntoView({behavior:"smooth"})}
function showQuiz(){document.getElementById("quizSection").scrollIntoView({behavior:"smooth"})}
function examInfo(){alert("KPSC • PSI • PDO • FDA • SDA • SSC • Railway ಪರೀಕ್ಷೆಗಳಿಗೆ ಉಪಯುಕ್ತ ಪ್ರಶ್ನೆಗಳನ್ನು ಇಲ್ಲಿ ಸೇರಿಸಬಹುದು.")}
function youtubeInfo(){alert("YouTube Title, Description ಮತ್ತು Hashtag Generator ಅನ್ನು Siri AIಗೆ ಸೇರಿಸಬಹುದು.")}

  function newChat(){
  const chatBox = document.getElementById("chatBox");
  if(chatBox){
    chatBox.innerHTML = `
      <div class="message ai">
        ನಮಸ್ಕಾರ! 👋<br>
        ನಾನು Siri AI. ನಿಮ್ಮ ಪ್ರಶ್ನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಕೇಳಿ.
      </div>
    `;
  }
}
  function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("ಈ browser ನಲ್ಲಿ Voice Input support ಇಲ್ಲ.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "kn-IN";
  recognition.interimResults = false;
  recognition.start();

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    document.getElementById("userInput").value = text;
  };
}
  function searchWeb() {
  const input = document.getElementById("userInput");
  const query = input.value.trim();

  if (!query) {
    alert("ದಯವಿಟ್ಟು ಮೊದಲು ಪ್ರಶ್ನೆ ಬರೆಯಿರಿ.");
    return;
  }

 const chatBox = document.getElementById("chatBox");

chatBox.innerHTML += `
  <div class="message user">${query}</div>
  <div class="message ai">
    🔎 <b>Search:</b> "${query}"<br>
    <a href="https://www.google.com/search?q=${encodeURIComponent(query)}"
       target="_blank">
       Googleನಲ್ಲಿ ಫಲಿತಾಂಶಗಳನ್ನು ನೋಡಿ →
    </a>
  </div>
`;

input.value = "";
chatBox.scrollTop = chatBox.scrollHeight;
}
  function saveCurrentChat() {
  const chatBox = document.getElementById("chatBox");

  if (!chatBox) return;

  const chats = JSON.parse(
    localStorage.getItem("siriChats") || "[]"
  );

  chats.push({
    id: Date.now(),
    title: chatBox.querySelector(".message.user")?.textContent?.slice(0, 40) || "New Chat",
    html: chatBox.innerHTML
  });

  localStorage.setItem("siriChats", JSON.stringify(chats));
}
  function newChat() {
  const chatBox = document.getElementById("chatBox");

    saveCurrentChat();

  chatBox.innerHTML = `
    <div class="message ai">
      ನಮಸ್ಕಾರ! 👋<br>
      ನಾನು <b>Siri AI</b>.<br>
      ನಿಮ್ಮ ಪ್ರಶ್ನೆಯನ್ನು ಕನ್ನಡದಲ್ಲಿ ಕೇಳಿ.
    </div>
  `;

  document.getElementById("userInput").value = "";
}
</script>
</body>
</html>
