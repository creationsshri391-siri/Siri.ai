<script>
  let uploadedImage = null;
  let uploadedFile = null;
  let uploadedFileName = null;

async function handleImageUpload(event) {
  const file = event.target.files[0];

  if (!file) return;

  const imagePreview = document.getElementById("imagePreview");

  uploadedFile = null;
  uploadedFileName = null;
  uploadedImage = null;

  imagePreview.innerHTML = `
    <div style="
      padding:10px 14px;
      background:#f3f4f6;
      border-radius:12px;
      font-size:14px;
    ">
      ⚡ Image optimizing...
    </div>
  `;

  try {
    const objectUrl = URL.createObjectURL(file);

    const img = new Image();

    const compressedBlob = await new Promise((resolve, reject) => {
      img.onload = () => {
        const maxWidth = 1600;
        const scale = Math.min(1, maxWidth / img.width);

        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);

        const ctx = canvas.getContext("2d");

        if (!ctx) {
          reject(new Error("Canvas not supported"));
          return;
        }

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        canvas.toBlob(
          (blob) => {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("Image compression failed"));
            }
          },
          "image/jpeg",
          0.75
        );
      };

      img.onerror = () => {
        reject(new Error("Image could not be loaded"));
      };

      img.src = objectUrl;
    });

    URL.revokeObjectURL(objectUrl);

    imagePreview.innerHTML = `
      <div style="
        padding:10px 14px;
        background:#f3f4f6;
        border-radius:12px;
        font-size:14px;
      ">
        ⚡ Uploading image...
      </div>
    `;

    const blob = await window.uploadToBlob(
      "siri-image-" + Date.now() + ".jpg",
      compressedBlob,
      {
        access: "public",
        handleUploadUrl: "/api/upload"
      }
    );

    uploadedImage = blob.url;

    const previewImage = document.createElement("img");
    previewImage.src = uploadedImage;
    previewImage.style.maxWidth = "260px";
    previewImage.style.borderRadius = "12px";
    previewImage.style.display = "block";

    imagePreview.innerHTML = "";
    imagePreview.appendChild(previewImage);

  } catch (error) {
    console.error("IMAGE UPLOAD ERROR:", error);

    imagePreview.innerHTML = `
      <div style="
        padding:10px 14px;
        background:#fee2e2;
        color:#991b1b;
        border-radius:12px;
      ">
        ❌ Image upload failed
      </div>
    `;
  }
}
 function handleFileUpload(event) {
  const file = event.target.files[0];

  if (!file) return;

  const userInput = document.getElementById("userInput");
  const imagePreview = document.getElementById("imagePreview");

  uploadedFileName = file.name;

  if (file.type.startsWith("image/")) {
    handleImageUpload(event);
    return;
  }

  const reader = new FileReader();

  reader.onload = function () {
    uploadedFile = reader.result;

    if (file.type === "text/plain") {
      userInput.value = reader.result;
      userInput.focus();
    }

    imagePreview.innerHTML = `
      <div style="
        padding:10px 14px;
        background:#f3f4f6;
        border-radius:12px;
        font-size:14px;
      ">
        ${file.type === "application/pdf" ? "PDF" : "FILE"} ${file.name}
      </div>
    `;
  };

  reader.readAsDataURL(file);
}
async function sendMessage(){
  const input = document.getElementById("userInput");
  const chatBox = document.getElementById("chatBox");
  const message =
  input.value.trim() ||
  (uploadedFile
    ? "ಈ document ಅನ್ನು ಓದಿ. ಅದರಲ್ಲಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಸರಿಯಾದ ಉತ್ತರ ಮತ್ತು ವಿವರಣೆ ನೀಡಿ."
    : "");
  const language = document.getElementById("languageSelect").value;

  if (!message && !uploadedFile && !uploadedImage) return;

  chatBox.innerHTML += `<div class="message user">${message}</div>`;

 message: message,

  function saveChatHistory() {
  const chatBox = document.getElementById("chatBox");
  localStorage.setItem("siriChatHistory", chatBox.innerHTML);
}
  window.addEventListener("load", () => {
  const chatBox = document.getElementById("chatBox");
  const savedChat = localStorage.getItem("siriChatHistory");

  if (savedChat && chatBox) {
    chatBox.innerHTML = savedChat;
  }
});
function showChatHistory() {
  const historyBox = document.getElementById("historyBox");

  if (!historyBox) return;

  if (historyBox.style.display === "block") {
    historyBox.style.display = "none";
    return;
  }

  const chats = JSON.parse(
    localStorage.getItem("siriChats") || "[]"
  );

  if (chats.length === 0) {
    historyBox.style.display = "none";
    alert("📜 ಯಾವುದೇ Chat History ಇಲ್ಲ.");
    return;
  }

  let historyHTML = `
    <div class="message ai">
      <b>📜 Chat History</b><br><br>
  `;

  chats.forEach((chat, index) => {
    historyHTML += `
      <button onclick="loadSavedChat(${index})"
        style="display:block;width:100%;margin:8px 0;padding:10px;border:0;border-radius:8px;cursor:pointer;">
        💬 ${chat.title || "New Chat"}
      </button>
    `;
  });

  historyHTML += `</div>`;

  historyBox.innerHTML = historyHTML;
  historyBox.style.display = "block";
}
  function hideChatHistory() {
  const historyBox = document.getElementById("historyBox");
  if (historyBox) {
    historyBox.style.display = "none";
  }
}

function loadSavedChat(index) {
  const chats = JSON.parse(
    localStorage.getItem("siriChats") || "[]"
  );

  if (chats[index]) {
    document.getElementById("chatBox").innerHTML = chats[index].html;
  }
}

function clearChatHistory() {
  localStorage.removeItem("siriChatHistory");
  document.getElementById("chatBox").innerHTML =
    '<div class="message ai">👋 ನಮಸ್ಕಾರ! ನಾನು Siri AI.</div>';
  alert("🗑️ Chat History cleared.");
}

  function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("ಈ browser ನಲ್ಲಿ Voice Input support ಇಲ್ಲ.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "kn-IN";
  recognition.interimResults = false;
  recognition.start();

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    document.getElementById("userInput").value = text;
  };
}

  function saveCurrentChat() {
  const chatBox = document.getElementById("chatBox");

  if (!chatBox) return;

  const firstUserMessage = chatBox.querySelector(".message.user");

  if (!firstUserMessage) return;

  const chats = JSON.parse(
    localStorage.getItem("siriChats") || "[]"
  );

  chats.push({
    id: Date.now(),
    title: firstUserMessage.textContent.trim().slice(0, 60),
    html: chatBox.innerHTML
  });

  localStorage.setItem("siriChats", JSON.stringify(chats));
}
